name: Build CPH2185 Flashlight Helper

on:
  workflow_dispatch:
  push:
    branches:
      - fox_12.1
    paths:
      - "tools/flashlightd.c"
      - ".github/workflows/build-flashlight-helper.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;27.2.12479018"

      - name: Build ARM64 helper
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          test -x "$CLANG"
          mkdir -p out
          "$CLANG" -std=c11 -O2 -Wall -Wextra -Werror \
            -fPIE -pie -Wl,--build-id=sha1 \
            tools/flashlightd.c -o out/flashlightd
          file out/flashlightd
          readelf -h out/flashlightd | grep -E 'Class:|Machine:'

      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: CPH2185-flashlight-helper-arm64
          path: out/flashlightd
          if-no-files-found: error
          retention-days: 14
